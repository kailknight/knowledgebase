<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Base</title>
  <script>
    // Dark mode: saved choice, else the system setting (set before paint to avoid a flash).
    (function () {
      var t = null;
      try { t = localStorage.getItem('kb_theme'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
  <header class="topbar">
    <div class="inner">
      <a class="brand" href="#/">📚 Knowledge Base</a>
      <button class="btn btn-primary" id="newBtn" type="button">+ New article</button>
      <span class="spacer"></span>
      <button class="btn btn-ghost" id="nameBtn" type="button" title="Your name (shown on articles you add or edit)"></button>
      <button class="btn btn-ghost" id="themeBtn" type="button"></button>
    </div>
  </header>

  <main class="page" id="app"></main>

  <div class="lightbox" id="lightbox" hidden><img alt=""></div>
  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="js/config.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
</body>
</html>
